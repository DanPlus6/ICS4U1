<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page by: Ian Choy -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/searches.css">

    <link rel="icon" type="image/x-icon" href="assets/img/graduation-hat.png">
    
    <title>Program Searching</title>
</head>
<body>
    <a href="index.html" class="home-button" title="Return to Home Page"><img src="assets/img/home-button.png"></a>

    <main class="search-page">
        <section class="page-header">
            <p class="eyebrow">Program Search</p>
            <h1>Find University Programs</h1>
            <p class="intro">Search by school, program, co-op availability, tuition range, or program length.</p>
        </section>

        <section class="search-panel page-panel">
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="Search for a program...">
                <button type="button" class="search-button" id="btn-search">
                    <img src="assets/img/search-button.png">
                </button>
            </div>

            <div class="filter-menus" aria-label="Search filters">
                <span class="filter-label">Filters:</span>

                <div class="filter-control">
                    <details class="filter-menu">
                        <summary>Co-op</summary>
                        <div class="filter-menu-content">
                            <button type="button" class="ghost" id="btn-toggle-coop">Has Co-op: Yes</button>
                        </div>
                    </details>
                </div>

                <div class="filter-control">
                    <details class="filter-menu">
                        <summary>Tuition</summary>
                        <div class="filter-menu-content tuition-menu-content">
                            <input type="number" id="tuition-min" placeholder="Minimum">
                            <input type="number" id="tuition-max" placeholder="Maximum">
                            <button type="button" class="secondary" id="btn-swap-tuition">Domestic Tuition</button>
                        </div>
                    </details>
                </div>

                <div class="filter-control">
                    <details class="filter-menu">
                        <summary>Program Length</summary>
                        <div class="filter-menu-content">
                            <input type="number" id="program-length" placeholder="Program Length">
                        </div>
                    </details>
                </div>

                <button type="button" id="btn-sort" class="sort-btn" title="Sort results by program name">
                    <span class="sort-icon">↑</span>
                    <span class="sort-label">Name</span>
                    <span class="sort-dir">A~Z</span>
                </button>
            </div>
        </section>

        <section class="results-section">
            <h2>Search Results</h2>
            <div id="div-results" class="results-grid"></div>
        </section>
    </main>
    <script type="module" src="assets/script/searches.js"></script>
</body>
</html>
