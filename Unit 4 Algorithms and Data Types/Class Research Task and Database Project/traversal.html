<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page by: Ian Choy -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/traversal.css">

    <link rel="icon" type="image/x-icon" href="assets/img/graduation-hat.png">
    
    <title>Program Traversal</title>
</head>
<body>
    <a href="index.html" class="home-button" title="Return to Home Page"><img src="assets/img/home-button.png"></a>

    <main class="traversal-page">
        <section class="page-header">
            <p class="eyebrow">Program Traversal</p>
            <h1>Browse University Programs</h1>
            <p class="intro">Move through the saved university program database one program at a time.</p>
        </section>

        <section id="program-container" class="program-container"></section>
    </main>
    
    <span class="traversal-buttons" aria-label="Program navigation">
        <button id="btn-prev" type="button" aria-label="Previous program">&lt;</button>
        <button id="btn-next" type="button" aria-label="Next program">&gt;</button>
    </span>
    
    <script type="module" src="assets/script/traversal.js"></script>
</body>
</html>
