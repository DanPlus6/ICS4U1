<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Page by: Ian Choy and David Fu -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/edit_programs.css">

    <link rel="icon" type="image/x-icon" href="assets/img/graduation-hat.png">
    
    <title>Edit Programs</title>
</head>
<body>
    <a href="index.html" class="home-button" title="Return to Home Page"><img src="assets/img/home-button.png"></a>

    <main class="editor-page">
        <section class="page-header">
            <p class="eyebrow">Program Database</p>
            <h1>Add a University Program</h1>
            <p class="intro">Enter the school, program, cost, admission, and source details for a new database entry.</p>
        </section>

        <section class="program-form page-panel">
            <h2>School Details</h2>
            <input type = "text" id = "schoolName" placeholder="Name of School">
            <input type = "text" id = "city" placeholder="City of School">
            <input type = "text" id = "province" placeholder="Province of School">
            <input type = "text" id = "country" placeholder="Country of School">
            <input type = "text" id = "schoolPicture" placeholder="Picture of School (URL)">
            <input type = "text" id = "mapPicture" placeholder="Map of School (URL)">

            <h2>Program Details</h2>
            <input type = "text" id = "programName" placeholder="Name of Program">
            <input type = "number" id = "lengthOfProgram" placeholder="Length of Program">
            <input type = "text" id = "programDescription" placeholder="Description of Program">
            <button type = "button" id = "hasCoop">Has Coop: Yes</button>
            <input type = "text" id = "admissionCoursesNeeded" placeholder="Courses needed for Admission">
            <input type = "number" id = "admissionAverageNeeded" placeholder="Averages needed for Admission">

            <h2>Costs</h2>
            <input type = "number" id = "domesticTuition" placeholder="Domestic Tuition">
            <input type = "number" id = "internationalTuition" placeholder="International Tuition">
            <input type = "text" id = "academicCostDetails" placeholder="Academic Cost Details">
            <input type = "number" id = "academicCost" placeholder="Academic Costs">
            <input type = "text" id = "livingCostDetails" placeholder="Living Cost Details">
            <input type = "number" id = "livingCost" placeholder="Living Costs">

            <h2>Facts and Sources</h2>
            <ul id = "interestingFacts">
                <li class = "Fact"></li>
            </ul>
            <button type="button" class="ghost" id="btn-addfact">Add Facts</button>
            <ul id = "primarySources">
                <li class = "priSource"></li>
            </ul>
            <button type="button" class="ghost" id="btn-addprimsource">Add Primary Sources</button>
            <ul id = "secondarySources">
                <li class = "secSource"></li>
            </ul>
            <button type="button" class="ghost" id="btn-addsecsource">Add Secondary Sources</button>
        </section>

        <section class="form-actions">
            <button type="button" class="danger" id="btn-delete-last">Delete Last Saved</button>
            <button type="button" class="secondary" id="btn-verify">Verify</button>
            <button type="button" id="btn-save">Save</button>
        </section>
    </main>
    <script type="module" src="assets/script/edit_programs.js"></script>
</body>
</html>
