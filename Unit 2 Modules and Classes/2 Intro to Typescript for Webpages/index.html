<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">



    <title>Mortgage Calculator</title>
</head>
<body>
    <h1>Mortgage Calc</h1>
    <input type="number" id="txt-principal" placeholder="Prinicpal (amount need to borrow)">
    <input type="number" id="txt-mortgage" placeholder="Mortgage rate (an annual interest rate as percentage)">
    <input type="number" id="txt-amortization" placeholder="Amortization period (how long mortgage is for, in years)">

    <button id="btn-calculate">Calculate Mortgage Payment</button>
    <p id="p-results"></p>
</body>
</html>
