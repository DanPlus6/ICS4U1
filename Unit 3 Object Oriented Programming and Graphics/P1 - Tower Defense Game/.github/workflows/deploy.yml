name: Deploy TypeScript Web Project to GitHub Pages

on:
    push:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build project
              run: bun run build

            - name: Assemble Pages site
              run: |
                  mkdir -p site/src/pages/home/assets
                  mkdir -p site/src/pages/generation/assets
                  mkdir -p site/src/pages/validation/assets
                  mkdir -p site/dist
                  cp index.html generate.html validate.html site/
                  cp src/pages/global.css site/src/pages/
                  cp src/pages/home/assets/index.css site/src/pages/home/assets/
                  cp src/pages/generation/assets/generate.css site/src/pages/generation/assets/
                  cp src/pages/validation/assets/validate.css site/src/pages/validation/assets/
                  cp -R dist/. site/dist/

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: ./site

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        needs: build
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
